<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>枚举配置调试工具</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            color: #409EFF;
        }
        .section {
            background: #f5f7fa;
            padding: 15px;
            margin: 15px 0;
            border-radius: 4px;
        }
        pre {
            background: #fff;
            padding: 10px;
            border-radius: 4px;
            overflow-x: auto;
        }
        button {
            background: #409EFF;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover {
            background: #66b1ff;
        }
        .error {
            color: #F56C6C;
            font-weight: bold;
        }
        .success {
            color: #67C23A;
            font-weight: bold;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #409EFF;
            color: white;
        }
    </style>
</head>
<body>
    <h1>🔍 枚举配置调试工具</h1>
    
    <div class="section">
        <h2>操作</h2>
        <button onclick="loadAllConfigs()">刷新配置</button>
        <button onclick="clearAllConfigs()">清空所有配置</button>
    </div>

    <div class="section">
        <h2>所有枚举配置</h2>
        <div id="configList"></div>
    </div>

    <div class="section">
        <h2>原始数据</h2>
        <pre id="rawData"></pre>
    </div>

    <script>
        const STORAGE_KEY = 'template_enum_configs';

        function loadAllConfigs() {
            try {
                const data = localStorage.getItem(STORAGE_KEY);
                const rawDataEl = document.getElementById('rawData');
                const configListEl = document.getElementById('configList');

                if (!data) {
                    rawDataEl.textContent = '没有找到任何枚举配置数据';
                    configListEl.innerHTML = '<p class="error">localStorage中没有枚举配置</p>';
                    return;
                }

                const configs = JSON.parse(data);
                rawDataEl.textContent = JSON.stringify(configs, null, 2);

                // 生成配置列表
                let html = '<table><thead><tr><th>模板ID</th><th>区域</th><th>字段数</th><th>详情</th></tr></thead><tbody>';
                
                const moduleIds = Object.keys(configs);
                if (moduleIds.length === 0) {
                    configListEl.innerHTML = '<p class="error">没有任何模板配置</p>';
                    return;
                }

                moduleIds.forEach(moduleId => {
                    const config = configs[moduleId];
                    
                    ['object', 'operation', 'result'].forEach(section => {
                        if (config[section]) {
                            const sectionConfig = config[section];
                            const fieldCount = Object.keys(sectionConfig).length;
                            
                            let details = '<ul>';
                            for (const key in sectionConfig) {
                                const item = sectionConfig[key];
                                const optionsCount = item.options ? item.options.length : 0;
                                const optionsText = item.options ? item.options.map(o => `${o.label}: ${o.value}`).join(', ') : '无';
                                details += `<li><strong>${key}</strong>: ${item.fieldName || '未知'} (${optionsCount}个选项: ${optionsText})</li>`;
                            }
                            details += '</ul>';
                            
                            html += `<tr>
                                <td>${moduleId}</td>
                                <td>${section}</td>
                                <td>${fieldCount}</td>
                                <td>${details}</td>
                            </tr>`;
                        }
                    });
                });

                html += '</tbody></table>';
                configListEl.innerHTML = html;

                console.log('完整配置数据:', configs);
            } catch (error) {
                console.error('加载配置失败:', error);
                document.getElementById('configList').innerHTML = `<p class="error">加载失败: ${error.message}</p>`;
            }
        }

        function clearAllConfigs() {
            if (confirm('确定要清空所有枚举配置吗？此操作不可恢复！')) {
                localStorage.removeItem(STORAGE_KEY);
                alert('已清空所有配置');
                loadAllConfigs();
            }
        }

        // 页面加载时自动刷新
        window.onload = loadAllConfigs;
    </script>
</body>
</html>
