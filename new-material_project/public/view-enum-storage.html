<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>查看枚举配置存储</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            padding: 20px;
            background: #f5f7fa;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.1);
        }
        h1 {
            color: #303133;
            margin-bottom: 20px;
            border-bottom: 2px solid #409EFF;
            padding-bottom: 10px;
        }
        h2 {
            color: #606266;
            margin: 20px 0 10px;
            font-size: 18px;
        }
        .info-box {
            background: #ecf5ff;
            border: 1px solid #b3d8ff;
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 20px;
            color: #409EFF;
        }
        .button-group {
            margin: 20px 0;
            display: flex;
            gap: 10px;
        }
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }
        .btn-primary {
            background: #409EFF;
            color: white;
        }
        .btn-primary:hover {
            background: #66b1ff;
        }
        .btn-success {
            background: #67C23A;
            color: white;
        }
        .btn-success:hover {
            background: #85ce61;
        }
        .btn-danger {
            background: #F56C6C;
            color: white;
        }
        .btn-danger:hover {
            background: #f78989;
        }
        .btn-warning {
            background: #E6A23C;
            color: white;
        }
        .btn-warning:hover {
            background: #ebb563;
        }
        textarea {
            width: 100%;
            min-height: 400px;
            padding: 15px;
            border: 1px solid #dcdfe6;
            border-radius: 4px;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 13px;
            line-height: 1.6;
            resize: vertical;
        }
        .stats {
            background: #f9f9f9;
            padding: 15px;
            border-radius: 4px;
            margin: 20px 0;
        }
        .stats-item {
            display: inline-block;
            margin-right: 30px;
            font-size: 14px;
        }
        .stats-label {
            color: #909399;
        }
        .stats-value {
            color: #303133;
            font-weight: bold;
            margin-left: 5px;
        }
        .storage-path {
            background: #f4f4f5;
            padding: 10px;
            border-left: 3px solid #409EFF;
            margin: 15px 0;
            font-family: monospace;
            color: #606266;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🗂️ 枚举配置本地存储查看器</h1>
        
        <div class="info-box">
            <strong>📌 存储位置：</strong>浏览器 localStorage<br>
            <strong>🔑 存储键名：</strong>template_enum_configs<br>
            <strong>💾 存储方式：</strong>JSON 格式
        </div>

        <div class="storage-path">
            <strong>如何手动查看：</strong><br>
            1. 按 F12 打开浏览器开发者工具<br>
            2. 切换到 "Application" 或 "应用程序" 标签<br>
            3. 左侧找到 "Local Storage" → 选择当前域名<br>
            4. 找到键名 "template_enum_configs"
        </div>

        <h2>📊 存储统计</h2>
        <div class="stats" id="stats">
            <div class="stats-item">
                <span class="stats-label">模板数量:</span>
                <span class="stats-value" id="templateCount">0</span>
            </div>
            <div class="stats-item">
                <span class="stats-label">总数据大小:</span>
                <span class="stats-value" id="dataSize">0 KB</span>
            </div>
            <div class="stats-item">
                <span class="stats-label">最后更新:</span>
                <span class="stats-value" id="lastUpdate">-</span>
            </div>
        </div>

        <h2>🔧 操作</h2>
        <div class="button-group">
            <button class="btn-primary" onclick="loadData()">🔄 刷新数据</button>
            <button class="btn-success" onclick="downloadData()">💾 下载备份</button>
            <button class="btn-warning" onclick="importData()">📥 导入数据</button>
            <button class="btn-danger" onclick="clearData()">🗑️ 清空所有配置</button>
        </div>

        <h2>📄 存储内容（JSON格式）</h2>
        <textarea id="dataDisplay" readonly placeholder="点击"刷新数据"按钮查看存储内容..."></textarea>

        <input type="file" id="fileInput" style="display:none" accept=".json" onchange="handleFileSelect(event)">
    </div>

    <script>
        // 加载数据
        function loadData() {
            try {
                const data = localStorage.getItem('template_enum_configs');
                if (data) {
                    const parsed = JSON.parse(data);
                    document.getElementById('dataDisplay').value = JSON.stringify(parsed, null, 2);
                    
                    // 更新统计信息
                    const templateCount = Object.keys(parsed).length;
                    const dataSize = (new Blob([data]).size / 1024).toFixed(2);
                    
                    // 查找最后更新时间
                    let lastUpdate = '-';
                    for (let key in parsed) {
                        if (parsed[key].timestamp) {
                            lastUpdate = new Date(parsed[key].timestamp).toLocaleString('zh-CN');
                            break;
                        }
                    }
                    
                    document.getElementById('templateCount').textContent = templateCount;
                    document.getElementById('dataSize').textContent = dataSize + ' KB';
                    document.getElementById('lastUpdate').textContent = lastUpdate;
                    
                    alert('✅ 数据加载成功！共 ' + templateCount + ' 个模板配置');
                } else {
                    document.getElementById('dataDisplay').value = '暂无数据';
                    document.getElementById('templateCount').textContent = '0';
                    document.getElementById('dataSize').textContent = '0 KB';
                    document.getElementById('lastUpdate').textContent = '-';
                    alert('ℹ️ 暂无枚举配置数据');
                }
            } catch (error) {
                alert('❌ 数据加载失败: ' + error.message);
                console.error(error);
            }
        }

        // 下载数据
        function downloadData() {
            try {
                const data = localStorage.getItem('template_enum_configs');
                if (!data) {
                    alert('⚠️ 暂无数据可下载');
                    return;
                }
                
                const blob = new Blob([data], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'enum-configs-backup-' + new Date().toISOString().slice(0, 10) + '.json';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                
                alert('✅ 备份文件已下载');
            } catch (error) {
                alert('❌ 下载失败: ' + error.message);
                console.error(error);
            }
        }

        // 导入数据
        function importData() {
            if (!confirm('⚠️ 导入数据将覆盖现有配置，是否继续？')) {
                return;
            }
            document.getElementById('fileInput').click();
        }

        // 处理文件选择
        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = e.target.result;
                    const parsed = JSON.parse(data);
                    localStorage.setItem('template_enum_configs', JSON.stringify(parsed));
                    loadData();
                    alert('✅ 数据导入成功');
                } catch (error) {
                    alert('❌ 导入失败: ' + error.message);
                    console.error(error);
                }
            };
            reader.readAsText(file);
            
            // 重置文件输入
            event.target.value = '';
        }

        // 清空数据
        function clearData() {
            if (!confirm('⚠️ 确定要清空所有枚举配置吗？此操作不可恢复！')) {
                return;
            }
            if (!confirm('⚠️⚠️ 再次确认：真的要删除所有配置吗？')) {
                return;
            }
            
            try {
                localStorage.removeItem('template_enum_configs');
                loadData();
                alert('✅ 所有配置已清空');
            } catch (error) {
                alert('❌ 清空失败: ' + error.message);
                console.error(error);
            }
        }

        // 页面加载时自动加载数据
        window.onload = function() {
            loadData();
        };
    </script>
</body>
</html>
